<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="l1-title">
  <title id="l1-title">Pass the Baton: horizontal lockup</title>
  <defs>
    <linearGradient id="l1-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D98E1C"/>
      <stop offset="0.10" stop-color="#FFCF73"/>
      <stop offset="0.20" stop-color="#FFF4DC"/>
      <stop offset="0.30" stop-color="#FFC34F"/>
      <stop offset="0.55" stop-color="#F5A623"/>
      <stop offset="0.78" stop-color="#C27A0C"/>
      <stop offset="0.88" stop-color="#A85F07"/>
      <stop offset="0.94" stop-color="#B5700F"/>
      <stop offset="1" stop-color="#6B3B04"/>
    </linearGradient>
    <linearGradient id="l1-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4DC"/>
      <stop offset="0.4" stop-color="#FFC34F"/>
      <stop offset="1" stop-color="#8A4E06"/>
    </linearGradient>
    <linearGradient id="l1-hole" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A0E02"/>
      <stop offset="0.6" stop-color="#3D2205"/>
      <stop offset="1" stop-color="#9A5A0A"/>
    </linearGradient>
    <clipPath id="l1-clip">
      <path d="M-550 -74 L550 -66 A22 66 0 0 1 550 66 L-550 74 Z"/>
    </clipPath>
    <filter id="l1-blur" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <ellipse cx="170" cy="274" rx="118" ry="9" fill="#111318" opacity="0.3" filter="url(#l1-blur)"/>
  <g transform="translate(165 160) rotate(-32) scale(0.25)">
    <path d="M-550 -74 L550 -66 A22 66 0 0 1 550 66 L-550 74 Z" fill="url(#l1-body)"/>
    <g clip-path="url(#l1-clip)" fill="none" stroke-linecap="round">
      <path d="M-560 -58 L580 -52 M-560 -22 L580 -20 M-560 8 L580 7 M-560 36 L580 33" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>
      <path d="M-560 -40 L580 -36 M-560 -6 L580 -5 M-560 22 L580 20 M-560 52 L580 48" stroke="#3A2002" stroke-opacity="0.12" stroke-width="3"/>
      <path d="M-520 -44 L540 -39" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="7"/>
    </g>
    <path d="M550 -66 A22 66 0 0 1 550 66" fill="none" stroke="#6B3B04" stroke-opacity="0.35" stroke-width="4"/>
    <ellipse cx="-550" cy="0" rx="26" ry="74" fill="url(#l1-rim)"/>
    <ellipse cx="-547" cy="3" rx="19" ry="61" fill="url(#l1-hole)"/>
    <path d="M-573.8 -30 A26 74 0 0 1 -550 -74" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="330" y="190" font-family="'Archivo Black', 'Arial Black', sans-serif" font-size="82" letter-spacing="-1" fill="#111318">Pass the Baton</text>
  <text x="334" y="244" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="4" fill="#6B3B04">PASSING IT ON IS LEADERSHIP</text>
</svg>
