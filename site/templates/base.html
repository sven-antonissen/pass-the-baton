<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pass the Baton">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{locale}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{t:baton_alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{og_image}}">
<meta name="theme-color" content="#111318">
<link rel="icon" href="{{up}}brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{up}}style.css">
{{jsonld}}
{{langdetect}}
</head>
<body>
<header class="top"><div class="wrap">
<a class="brand" href="{{base}}"><img src="{{up}}brand/favicon.svg" alt="">Pass the Baton</a>
<nav aria-label="Main">
<a href="{{base}}#demand">{{t:demand_heading}}</a>
<a href="{{base}}countries/">{{t:nav_countries}}</a>
<a href="{{base}}manifesto/">{{t:nav_manifesto}}</a>
<a class="nav-cta" href="{{base}}join/">{{t:join_title}}</a>
</nav>
</div></header>
{{body}}
<footer><div class="wrap footer-grid">
<p><a href="{{base}}about/">{{t:nav_about}}</a> · {{t:footer_text}} {{t:footer_licences}} <a href="{{repo}}">{{t:footer_source}}</a>.</p>
<details class="lang-switch">
<summary aria-label="{{t:language_label}}">{{lang_name}}</summary>
<ul>{{switcher}}</ul>
</details>
</div></footer>
</body>
</html>
