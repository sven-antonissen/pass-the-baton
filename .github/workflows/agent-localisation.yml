name: Agent - localisation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - MANIFESTO.md
      - agents/localisation/languages.md

concurrency:
  group: agent-localisation
  cancel-in-progress: false

jobs:
  localisation:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_run-agent.yml
    with:
      agent: localisation
      output: translations
      title: "Localisation agent: new translations"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
