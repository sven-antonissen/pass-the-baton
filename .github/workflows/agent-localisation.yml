name: Agent - localisation

on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional: the language codes to work on in this run, e.g. 'es, fr, de'"
        required: false
        default: ""

concurrency:
  group: agent-localisation-${{ inputs.focus }}
  cancel-in-progress: false

jobs:
  localisation:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_run-agent.yml
    with:
      agent: localisation
      output: translations
      title: "Localisation agent: translations and website texts"
      focus: ${{ inputs.focus }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
