name: Website

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1" # weekly rebuild so ages on the countries page stay current
  push:
    branches: [main]
    paths:
      - site/**
      - brand/**
      - MANIFESTO.md
      - translations/**
      - data/**
      - .github/workflows/website.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python site/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
