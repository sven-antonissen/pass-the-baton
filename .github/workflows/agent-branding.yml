name: Agent - branding

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *" # 06:17 UTC on the 1st of each month

concurrency:
  group: agent-branding
  cancel-in-progress: false

jobs:
  branding:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_run-agent.yml
    with:
      agent: branding
      output: brand
      title: "Branding agent: brand identity proposal"
      timeout: 45
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
