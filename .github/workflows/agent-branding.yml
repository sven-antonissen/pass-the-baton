name: Agent - branding

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *" # 06:17 UTC on the 1st of each month

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-branding
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install anthropic

      - name: Run the agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agents/runner.py branding

      - name: Open a pull request for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- brand)" ]; then
            echo "No changes; nothing to review."
            exit 0
          fi
          branch="agent/branding-${{ github.run_id }}"
          git config user.name "pass-the-baton-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add brand
          git commit -m "Branding agent: brand identity proposal"
          git push origin "$branch"
          gh pr create \
            --title "Branding agent: brand identity proposal" \
            --body-file .agent-pr-body.md \
            --label agent \
            || gh pr create \
              --title "Branding agent: brand identity proposal" \
              --body-file .agent-pr-body.md
