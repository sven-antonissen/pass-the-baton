name: Agent chain

# When a maintainer merges an agent's pull request, start that agent's next
# batch, as long as its queue still has items. Merging stays the human
# approval: nothing runs again until the previous batch is approved.

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  next-batch:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'agent/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Start the next batch if the queue is not done
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          agent="${BRANCH#agent/}"
          agent="${agent%-*}"
          case "$agent" in
            localisation|research) ;;
            *) echo "No chaining for '$agent'."; exit 0 ;;
          esac
          left=$(python3 agents/queue_status.py "$agent")
          echo "Items left for $agent: $left"
          if [ "$left" -gt 0 ]; then
            gh workflow run "agent-$agent.yml" --ref main
            echo "Started the next $agent batch."
          else
            echo "Queue done; not starting another run."
          fi
